name: Release binaries

# Builds a standalone binary for each platform (a Node.js single executable
# application with the classifier model embedded) and attaches it to the
# GitHub release. The install script is attached first, so its download link
# works at once (it asks users to try again later while SHA256SUMS is missing).
#
# The builds, which install dependencies from npm and run their scripts, can
# only read the repository: each hashes the binary it built and hands both
# to the publish job as workflow artifacts. The publish job, which runs no
# code from npm, checks each binary against its build's hash, attests their
# provenance, and attaches the binaries and SHA256SUMS (the builds' hashes)
# to the release.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # postject is installed with npx at this exact version.
  POSTJECT: postject@1.0.0-alpha.6

jobs:
  # The release tag must name the version in package.json, which the binaries report.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$version"
            exit 1
          fi
      - name: Attach install.sh to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" scripts/install.sh --clobber --repo "$GITHUB_REPOSITORY"

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: spamscanner-linux-x64
          - os: ubuntu-24.04-arm
            artifact: spamscanner-linux-arm64
          - os: macos-15-intel
            artifact: spamscanner-darwin-x64
          - os: macos-15
            artifact: spamscanner-darwin-arm64
          - os: windows-latest
            artifact: spamscanner-win-x64.exe
    env:
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Build the SEA blob with the model as an asset
        shell: bash
        run: |
          cat > sea-config.json << 'JSON'
          {
            "main": "dist/standalone/cli.cjs",
            "output": "sea-prep.blob",
            "disableExperimentalSEAWarning": true,
            "useSnapshot": false,
            "useCodeCache": true,
            "assets": {"classifier.json": "model/classifier.json"}
          }
          JSON
          node --experimental-sea-config sea-config.json
      - name: Create the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "$(command -v node)" "$ARTIFACT"
          npx --yes "$POSTJECT" "$ARTIFACT" NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x "$ARTIFACT"
      - name: Create the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cp "$(command -v node)" "$ARTIFACT"
          codesign --remove-signature "$ARTIFACT"
          npx --yes "$POSTJECT" "$ARTIFACT" NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
          codesign --sign - "$ARTIFACT"
          chmod +x "$ARTIFACT"
      - name: Create the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item (Get-Command node).Source -Destination $env:ARTIFACT
          npx --yes $env:POSTJECT $env:ARTIFACT NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
      # The binary must run, find its embedded model and catch the GTUBE test string.
      - name: Test the binary
        shell: bash
        run: |
          "./$ARTIFACT" version
          printf 'From: a@example.com\r\nSubject: Test\r\n\r\nXJS*C4JDBQADN1.NSBN3*2IDNEN*GTUBE-STANDARD-ANTI-UBE-TEST-EMAIL*C.34X\r\n' > gtube.eml
          # (spam exits 1, so neither scan is in a pipeline: bash runs this
          #  step with pipefail)
          set +e
          "./$ARTIFACT" scan gtube.eml --no-cloudflare
          code=$?
          "./$ARTIFACT" scan gtube.eml --no-cloudflare --json > gtube.json
          json=$?
          set -e
          test "$code" = 1
          test "$json" = 1
          node -e "const r=JSON.parse(require('fs').readFileSync('gtube.json','utf8'));const names=r.tests.map(t=>t.name);if(!names.includes('GTUBE')||!names.some(n=>n.startsWith('BAYES_')))process.exit(1)"
      # The hash of the binary as built here, published as SHA256SUMS.
      - name: Hash the binary
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then
            hash="$(sha256sum "$ARTIFACT")"
          else
            hash="$(shasum -a 256 "$ARTIFACT")"
          fi
          printf '%s  %s\n' "${hash%% *}" "$ARTIFACT" | tee "$ARTIFACT.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Runs after every build, even a failed one, over the binaries that were
  # built, and then fails if any build did. Re-running a failed build re-runs
  # this job, which attaches its binary and replaces SHA256SUMS.
  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # (with no build finished there is nothing to download)
        continue-on-error: true
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets
      - name: Check the binaries against their builds' hashes
        id: sums
        run: |
          mkdir -p assets sums
          if compgen -G 'assets/*.sha256' > /dev/null; then
            mv assets/*.sha256 sums/
            for file in sums/*.sha256; do
              (cd assets && sha256sum -c "../$file")
            done
            cat sums/*.sha256 > SHA256SUMS
            cat SHA256SUMS
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: ${{ steps.sums.outputs.found == 'true' }}
        with:
          subject-path: assets/spamscanner-*
      - name: Attach the binaries and SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          FOUND: ${{ steps.sums.outputs.found }}
        run: |
          if [ "$FOUND" = true ]; then
            gh release upload "$TAG" assets/spamscanner-* --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Some binaries were not built ($BUILD_RESULT); only those built are attached and in SHA256SUMS. Re-run the failed builds."
            exit 1
          fi
